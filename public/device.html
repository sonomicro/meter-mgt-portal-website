<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Water Flow Monitor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .spinner {
      animation: spin 1s linear infinite;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div id="app"></div>

  <script>
    const SUPABASE_URL = 'https://xrmwxqhhaeahabeppvuk.supabase.co';

    const urlParams = new URLSearchParams(window.location.search);
    const deviceId = window.location.pathname.split('/device/')[1]?.split('.html')[0];
    const flowValue = urlParams.get('flow');
    const flowUnit = urlParams.get('unit') || 'L/min';
    const timestamp = urlParams.get('timestamp');

    let deviceInfo = null;

    async function loadDeviceInfo() {
      const app = document.getElementById('app');

      app.innerHTML = `
        <div style="background: linear-gradient(135deg, #EFF6FF 0%, #ECFEFF 100%);" class="min-h-screen w-full flex items-center justify-center p-4">
          <div class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full">
            <div class="flex items-center justify-center">
              <div class="spinner rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
            </div>
            <p class="text-center text-gray-600 mt-4">Loading device information...</p>
          </div>
        </div>
      `;

      if (!deviceId) {
        showError('Invalid device URL');
        return;
      }

      try {
        const response = await fetch(\`\${SUPABASE_URL}/functions/v1/public-device-info\`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ device_id: deviceId })
        });

        if (!response.ok) {
          throw new Error('Device not found');
        }

        const data = await response.json();
        deviceInfo = data.device_info;

        if (flowValue) {
          await recordTap();
        }

        renderDeviceView();
      } catch (error) {
        showError(error.message);
      }
    }

    async function recordTap() {
      try {
        await fetch(\`\${SUPABASE_URL}/functions/v1/record-nfc-tap\`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            device_id: deviceId,
            flow_value: parseFloat(flowValue),
            flow_unit: flowUnit,
            measurement_timestamp: timestamp || new Date().toISOString(),
            user_agent: navigator.userAgent
          })
        });
      } catch (error) {
        console.error('Failed to record tap:', error);
      }
    }

    function renderDeviceView() {
      const primaryColor = deviceInfo.tenant_primary_color || '#2563eb';
      const secondaryColor = deviceInfo.tenant_secondary_color || '#0891b2';

      const app = document.getElementById('app');
      app.innerHTML = \`
        <div style="background: linear-gradient(135deg, \${primaryColor}15 0%, \${secondaryColor}15 100%);" class="min-h-screen w-full flex items-center justify-center p-4">
          <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
            <!-- Header with Logo -->
            <div class="text-center mb-8">
              \${deviceInfo.tenant_logo ?
                \`<img src="\${deviceInfo.tenant_logo}" alt="\${deviceInfo.tenant_company}" class="h-16 mx-auto mb-4 object-contain">\` :
                \`<div style="background-color: \${primaryColor}20;" class="h-16 w-16 mx-auto mb-4 rounded-full flex items-center justify-center">
                  <svg class="h-8 w-8" style="color: \${primaryColor};" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path>
                  </svg>
                </div>\`
              }
              <h1 class="text-2xl font-bold text-gray-900 mb-1">
                \${deviceInfo.tenant_company || deviceInfo.tenant_name}
              </h1>
              <p class="text-sm text-gray-500">Water Flow Monitor</p>
            </div>

            <!-- Device Info -->
            <div class="bg-gray-50 rounded-xl p-4 mb-6">
              <div class="flex items-center justify-between mb-2">
                <span class="text-sm font-medium text-gray-600">Device:</span>
                <span class="text-sm font-semibold text-gray-900">\${deviceInfo.device_name}</span>
              </div>
              <div class="flex items-center justify-between">
                <span class="text-sm font-medium text-gray-600">Serial:</span>
                <span class="text-sm font-mono text-gray-700">\${deviceInfo.serial_number}</span>
              </div>
            </div>

            <!-- Flow Data -->
            \${flowValue ? \`
              <div style="background: linear-gradient(135deg, \${primaryColor} 0%, \${secondaryColor} 100%);" class="rounded-xl p-6 mb-6 text-white">
                <div class="flex items-center gap-2 mb-3">
                  <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
                  </svg>
                  <span class="text-sm font-medium opacity-90">Current Flow Rate</span>
                </div>
                <div class="flex items-baseline gap-2">
                  <span class="text-5xl font-bold">\${flowValue}</span>
                  <span class="text-2xl font-medium opacity-90">\${flowUnit}</span>
                </div>
                \${timestamp ? \`
                  <div class="flex items-center gap-2 mt-4 text-sm opacity-75">
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span>Measured: \${new Date(timestamp).toLocaleString()}</span>
                  </div>
                \` : ''}
              </div>
            \` : \`
              <div class="bg-blue-50 border border-blue-200 rounded-xl p-6 mb-6">
                <div class="flex items-center gap-3">
                  <svg class="h-6 w-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path>
                  </svg>
                  <div>
                    <p class="font-medium text-blue-900">No Flow Data Available</p>
                    <p class="text-sm text-blue-700">Tap the device to see current readings</p>
                  </div>
                </div>
              </div>
            \`}

            <!-- Information -->
            <div class="bg-amber-50 border border-amber-200 rounded-lg p-4 mb-6">
              <p class="text-sm text-amber-800">
                <strong>Note:</strong> This is a public view of your device. For detailed analytics,
                history, and configuration, please log in to the full portal.
              </p>
            </div>

            <!-- Login Button -->
            <a href="/login" style="background: linear-gradient(135deg, \${primaryColor} 0%, \${secondaryColor} 100%);" class="block w-full py-3 px-6 rounded-lg text-white font-medium text-center transition-all hover:shadow-lg">
              <span class="flex items-center justify-center gap-2">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
                </svg>
                Access Full Portal
              </span>
            </a>

            <!-- Footer -->
            <p class="text-center text-xs text-gray-500 mt-6">
              Powered by \${deviceInfo.tenant_company || deviceInfo.tenant_name}
            </p>
          </div>
        </div>
      \`;
    }

    function showError(message) {
      const app = document.getElementById('app');
      app.innerHTML = \`
        <div style="background: linear-gradient(135deg, #FEF2F2 0%, #FFF7ED 100%);" class="min-h-screen w-full flex items-center justify-center p-4">
          <div class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full">
            <div class="flex items-center justify-center mb-4">
              <div class="bg-red-100 rounded-full p-3">
                <svg class="h-8 w-8 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
              </div>
            </div>
            <h2 class="text-2xl font-bold text-gray-900 text-center mb-2">Device Not Available</h2>
            <p class="text-gray-600 text-center mb-6">\${message}</p>
            <a href="/" class="block w-full bg-blue-600 text-white py-3 px-6 rounded-lg hover:bg-blue-700 transition-colors text-center">
              Go to Login
            </a>
          </div>
        </div>
      \`;
    }

    loadDeviceInfo();
  </script>
</body>
</html>
